# STYL mobile — analyze & test on every change.
name: Mobile CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare assets
        run: chmod +x scripts/ci_prepare.sh && ./scripts/ci_prepare.sh

      - name: Pub get
        run: flutter pub get

      # Infos are reported but do not fail the job (Flutter treats them as fatal by default).
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
